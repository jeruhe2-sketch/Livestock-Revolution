name: debug-futures-slaughter

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: |
          python scripts/_debug_futures_slaughter.py > /tmp/probe.log 2>&1 || true
          cat /tmp/probe.log
      - name: post result as issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 /tmp/probe.log > /tmp/probe_tail.log
          gh issue create --title "debug: CME선물/도축 탐색 $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/probe_tail.log --repo "${{ github.repository }}"
