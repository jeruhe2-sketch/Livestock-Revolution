name: (임시) 강동2 재진단

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-main-git-write
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install playwright beautifulsoup4
      - name: Chromium 설치
        run: python -m playwright install --with-deps chromium
      - name: 실제 프로덕션 함수로 재진단 + 커밋
        env:
          NWILL_GANGDONG2_ID: ${{ secrets.NWILL_GANGDONG2_ID }}
          NWILL_GANGDONG2_PW: ${{ secrets.NWILL_GANGDONG2_PW }}
        run: |
          mkdir -p debug
          (cd scripts && python _tmp_debug_gd2_real.py) > debug/gd2_diagnosis2.log 2>&1 || true
          cat debug/gd2_diagnosis2.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f debug/gd2_diagnosis2.log
          git diff --cached --quiet && { echo "커밋할 변경사항 없음"; exit 0; }
          git commit -m "debug: 강동2 재진단 결과(패치 이후)"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --mixed origin/main; git add -f debug/gd2_diagnosis2.log; git commit -m "debug: 강동2 재진단(재시도)" || true; }
            sleep 3
          done
