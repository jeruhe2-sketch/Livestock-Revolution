name: mla-domestic-update

on:
  workflow_dispatch: {}

concurrency:
  group: repo-main-git-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: run
        id: run
        continue-on-error: true
        run: |
          mkdir -p debug
          python scripts/fetch_mla_domestic.py > debug/mla_domestic_last.log 2>&1
          code=$?
          cat debug/mla_domestic_last.log
          exit $code
      - name: commit
        id: commit
        if: always()
        continue-on-error: true
        run: |
          {
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            for i in 1 2 3 4 5 6 7 8; do
              git add data/mla_domestic.json
              if git diff --cached --quiet; then
                echo "변경 없음"
                break
              fi
              git commit -m "auto: 호주 MLA 내수지표 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
              if git push; then
                echo "push 성공"
                break
              fi
              echo "push 충돌, 재시도 $i"
              git fetch origin main
              git reset --mixed origin/main
              sleep $((RANDOM % 10 + 3))
            done
          } > debug/mla_domestic_commit_last.log 2>&1
          code=$?
          cat debug/mla_domestic_commit_last.log
          exit $code
      - name: 로그 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mla-domestic-logs
          path: debug/mla_domestic*.log
          retention-days: 14
          if-no-files-found: ignore
      - name: 실패 시 로그를 이슈로도 남김
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 debug/mla_domestic_last.log > /tmp/tail.log
          gh issue create --title "debug: mla-domestic-update 실패 로그 $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/tail.log --repo "${{ github.repository }}"
      - name: 실패 시 워크플로우도 실패로 표시
        if: steps.run.outcome == 'failure' || steps.commit.outcome == 'failure'
        run: |
          echo "::error::MLA 내수지표 수집 또는 커밋 실패. debug/ 로그 확인 필요"
          exit 1
