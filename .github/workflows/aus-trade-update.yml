name: 호주 축산물 수출현황(DAFF) 자동 갱신

on:
  workflow_dispatch:
    inputs:
      merge:
        description: "true면 실제 데이터 파일까지 갱신(병합), false면 파싱 결과만 debug에 저장(검증 모드)"
        type: boolean
        default: false

concurrency:
  group: repo-main-git-write  # 저장소 전체 워크플로우가 공유하는 잠금 (git push 충돌 방지)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl playwright requests
      - name: Chromium 브라우저 엔진 설치
        run: python -m playwright install --with-deps chromium
      - name: (진단) data.gov.au / UN Comtrade API 접근 가능 여부 확인
        continue-on-error: true
        run: |
          echo "=== data.gov.au CKAN API ==="
          curl -s -m 20 -o /tmp/ckan.json -w "status=%{http_code} time=%{time_total}s\n" \
            "https://data.gov.au/api/3/action/package_search?q=red%20meat%20export%20statistics&rows=3" || echo "요청 실패"
          head -c 800 /tmp/ckan.json; echo
          echo "=== UN Comtrade API (legacy, AU->KR 소고기 HS0201 2024) ==="
          curl -s -m 20 -o /tmp/comtrade.json -w "status=%{http_code} time=%{time_total}s\n" \
            "https://comtradeapi.un.org/public/v1/preview/C/M/HS?reporterCode=36&period=202401&partnerCode=410&cmdCode=0201&flowCode=X" || echo "요청 실패"
          head -c 800 /tmp/comtrade.json; echo
      - name: 호주 축산물 수출통계 수집
        id: fetch
        continue-on-error: true
        run: |
          mkdir -p debug
          ARGS=""
          if [ "${{ inputs.merge }}" = "true" ]; then ARGS="--merge"; fi
          python scripts/fetch_aus_meat_export.py $ARGS > debug/aus_trade_last.log 2>&1
          code=$?
          cat debug/aus_trade_last.log
          exit $code
      - name: 다운로드/파싱 결과를 아티팩트로 보관 (실패해도 항상)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aus-trade-debug
          path: |
            debug/aus_trade_last.log
            debug/aus_trade_parsed_*.json
            debug/aus_trade_downloads/*
          retention-days: 14
          if-no-files-found: ignore
      - name: (테스트 단계) 디버그 로그를 저장소에도 커밋해서 확인 가능하게 함
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f debug/aus_trade_last.log debug/aus_trade_parsed_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "커밋할 디버그 파일 없음"
            exit 0
          fi
          git commit -m "debug: 호주 축산물 수집 테스트 로그 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git push && break
            git fetch origin main
            git reset --mixed origin/main
            git add -f debug/aus_trade_last.log debug/aus_trade_parsed_*.json 2>/dev/null || true
            sleep 3
          done
      - name: 데이터 변경사항 확인 및 커밋 (merge=true 이고 성공했을 때만)
        if: steps.fetch.outcome == 'success' && inputs.merge == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aus_meat_export.json
          if git diff --cached --quiet; then
            echo "변경없음"
            exit 0
          fi
          git commit -m "chore: 호주 축산물 수출현황 자동 갱신 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 충돌, 재시도 $i"
            git fetch origin main
            git reset --mixed origin/main
            git add data/aus_meat_export.json
            git diff --cached --quiet && exit 0
            git commit -m "chore: 호주 축산물 수출현황 자동 갱신 재시도 $(date -u +%Y-%m-%d)"
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
      - name: 수집 실패 시 워크플로우를 실패로 표시
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::호주 축산물 수출통계 수집 실패. debug/aus_trade_last.log 및 아티팩트 확인 필요 (사이트 구조가 예상과 다를 가능성 높음 - 최초 실행임)"
          exit 1
      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] 호주 축산물 수출현황 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
