name: debug-mla-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: |
          python3 - <<'PYEOF' > /tmp/mla_probe.log 2>&1 || true
          import sys, traceback, time
          sys.path.insert(0, "scripts")
          import fetch_mla_domestic as m
          from datetime import date, timedelta

          today = date.today().isoformat()
          print("today=", today)

          t0 = time.time()
          try:
              s = m.fetch_indicator_series(0, "2026-08-01", today)
              print("indicator0 short-range OK", len(s), "rows, elapsed", time.time()-t0)
              print(s[-3:])
          except Exception:
              print("indicator0 short-range FAILED, elapsed", time.time()-t0)
              traceback.print_exc()

          t0 = time.time()
          try:
              slaughter_to = (date.today() - timedelta(days=10)).isoformat()
              slaughter_from = (date.today() - timedelta(days=24)).isoformat()
              sl = m.fetch_slaughter(slaughter_from, slaughter_to)
              print("slaughter short-range OK, elapsed", time.time()-t0)
              print(sl)
          except Exception:
              print("slaughter short-range FAILED, elapsed", time.time()-t0)
              traceback.print_exc()
          PYEOF
          cat /tmp/mla_probe.log
      - name: post result as issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "debug: MLA 짧은범위 진단 $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/mla_probe.log --repo "${{ github.repository }}"
