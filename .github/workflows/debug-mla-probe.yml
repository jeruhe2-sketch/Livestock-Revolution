name: debug-mla-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: |
          python scripts/_debug_mla_probe.py > /tmp/mla_probe.log 2>&1 || true
          cat /tmp/mla_probe.log
      - name: post result as issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "debug: MLA API 탐색 결과 $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/mla_probe.log --repo "${{ github.repository }}"
