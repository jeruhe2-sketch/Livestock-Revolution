name: debug-mla-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: |
          mkdir -p debug
          python scripts/_debug_mla_probe.py > debug/mla_probe_last.log 2>&1 || true
          cat debug/mla_probe_last.log
      - name: commit log
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add debug/mla_probe_last.log
          git diff --cached --quiet || git commit -m "debug: MLA API 탐색 로그"
          git push || true
