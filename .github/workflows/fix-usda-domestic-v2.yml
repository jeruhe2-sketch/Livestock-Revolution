name: Fix USDA domestic app loading v2
on:
  push:
    paths:
      - .github/workflows/fix-usda-domestic-v2.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden loader and cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>\n<script src="./scripts/usda_domestic_app.js?v=2"></script>\n<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>'
          new = '<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>\n<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>\n<script src="./scripts/usda_domestic_app.js?v=3"></script>'
          if old not in s:
              raise SystemExit('expected script block not found')
          s = s.replace(old, new, 1)
          old_ref = 'React.createElement(UsdaDomesticApp, null)'
          new_ref = 'React.createElement(window.UsdaDomesticApp, null)'
          if old_ref not in s:
              raise SystemExit('expected domestic app reference not found')
          s = s.replace(old_ref, new_ref, 1)
          p.write_text(s, encoding='utf-8')
          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          if 'const CACHE_VERSION = "v25";' not in w:
              raise SystemExit('expected service worker version not found')
          sw.write_text(w.replace('const CACHE_VERSION = "v25";', 'const CACHE_VERSION = "v26";', 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "fix: harden USDA domestic app loading"
          git push
          rm -f .github/workflows/fix-usda-domestic-v2.yml
          git add .github/workflows/fix-usda-domestic-v2.yml
          git commit -m "chore: remove temporary USDA fix workflow" || true
          git push || true
