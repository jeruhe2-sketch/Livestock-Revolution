name: EU TAXUD 다운로드 자동화 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: 페이지 구조 탐색 2
        run: |
          python3 << 'PYEOF' > eu_probe_result.txt 2>&1
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1600, "height": 1200})
              page.goto("https://agridata.ec.europa.eu/extensions/DashboardTaxud/TaxudWeeklyExport.html", wait_until="networkidle", timeout=60000)
              page.wait_for_timeout(2000)
              try:
                  page.click("text=Accept all cookies", timeout=5000)
                  print("쿠키 수락 클릭됨")
              except Exception as e:
                  print("쿠키 버튼 못찾음:", e)
              page.wait_for_timeout(15000)
              page.screenshot(path="eu_page.png", full_page=True)

              # iframe 안 내용도 확인
              frame = None
              for f in page.frames:
                  if "single/?appid" in f.url:
                      frame = f
                      break
              if frame:
                  print("Qlik iframe 찾음:", frame.url)
                  frame.wait_for_timeout(3000)
                  buttons = frame.locator("button, [role=button], .qv-object-title, span").all_text_contents()
                  print("iframe 안 텍스트 요소 일부:", buttons[:60])
              browser.close()
          PYEOF
          cat eu_probe_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eu_probe_result.txt eu_page.png
          git commit -m "test: 쿠키수락+대기 후 재탐색" || echo "변경없음"
          git push
