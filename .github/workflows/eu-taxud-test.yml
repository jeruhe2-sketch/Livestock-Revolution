name: EU TAXUD 다운로드 자동화 탐색 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Sector 박스[2] 정확히 클릭
        run: |
          python3 << 'PYEOF' > eu_probe_result.txt 2>&1
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1800, "height": 1200})
              page.goto("https://agridata.ec.europa.eu/extensions/DashboardTaxud/TaxudWeeklyExport.html", wait_until="networkidle", timeout=60000)
              page.wait_for_timeout(2000)
              try:
                  page.click("text=Accept all cookies", timeout=5000)
              except Exception:
                  pass
              page.wait_for_timeout(15000)

              frame = None
              for f in page.frames:
                  if "single/?appid" in f.url:
                      frame = f
                      break

              sector_box = frame.locator("text=Sector").nth(2)
              sector_box.click()
              page.wait_for_timeout(2000)
              page.screenshot(path="eu_after_sector_click.png", full_page=True)

              texts = frame.locator("div, span, td, li").all_text_contents()
              pigs_related = [t.strip() for t in texts if "Pig" in t or "PIG" in t.upper()]
              print("Pig 관련 텍스트:", pigs_related[:20])
              print()
              print("전체 짧은 텍스트(50자 이하) 최근 변화:")
              short = [t.strip() for t in texts if t.strip() and len(t.strip())<50]
              seen=set(); uniq=[]
              for t in short:
                  if t not in seen:
                      seen.add(t); uniq.append(t)
              for t in uniq[:80]:
                  print(" -", t)

              browser.close()
          PYEOF
          cat eu_probe_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eu_probe_result.txt eu_after_sector_click.png
          git commit -m "test: Sector[2] 클릭 후 상태" || echo "변경없음"
          git push
