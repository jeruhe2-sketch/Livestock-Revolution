name: EU TAXUD 다운로드 자동화 탐색 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Sector 박스 정확한 위치로 클릭
        run: |
          python3 << 'PYEOF' > eu_probe_result.txt 2>&1
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1800, "height": 1200})
              page.goto("https://agridata.ec.europa.eu/extensions/DashboardTaxud/TaxudWeeklyExport.html", wait_until="networkidle", timeout=60000)
              page.wait_for_timeout(2000)
              try:
                  page.click("text=Accept all cookies", timeout=5000)
              except Exception:
                  pass
              page.wait_for_timeout(15000)

              frame = None
              for f in page.frames:
                  if "single/?appid" in f.url:
                      frame = f
                      break

              # "Sector" 텍스트를 가진 모든 요소의 위치(bounding box) 확인
              elements = frame.locator("text=Sector").all()
              print("Sector 텍스트 매칭 요소 수:", len(elements))
              for i, el in enumerate(elements):
                  try:
                      box = el.bounding_box()
                      print(f"  [{i}] box={box}")
                  except Exception as e:
                      print(f"  [{i}] 에러: {e}")

              browser.close()
          PYEOF
          cat eu_probe_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eu_probe_result.txt
          git commit -m "test: Sector 요소들 좌표 확인" || echo "변경없음"
          git push
