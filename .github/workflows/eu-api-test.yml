name: EU API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 재확인
        run: |
          python3 << 'PYEOF' > eu_test_result.txt 2>&1
          import requests
          base = "https://api.tech.ec.europa.eu/agrifood"
          r = requests.get(f"{base}/v3/api-docs/pigmeat", timeout=20)
          print("pigmeat swagger ->", r.status_code)
          print(r.text[:500])
          PYEOF
          cat eu_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eu_test_result.txt
          git commit -m "test: 재확인" || echo "변경없음"
          git push
