name: EU API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Swagger 명세 후보 탐색
        run: |
          python3 << 'PYEOF' > eu_test_result.txt 2>&1
          import requests
          base = "https://api.tech.ec.europa.eu/agrifood"
          candidates = ["trade", "pigmeatTrade", "pigMeat", "eggs", "poultry", "dairy",
                        "tradeQuotas", "eggsTrade", "poultryTrade", "sheepmeat", "cereals"]
          for name in candidates:
              try:
                  r = requests.get(f"{base}/v3/api-docs/{name}", timeout=15)
                  print("===", name, "->", r.status_code)
                  if r.status_code == 200:
                      spec = r.json()
                      for path in spec.get("paths", {}):
                          print("  ", path)
              except Exception as e:
                  print(name, "에러:", e)

          # v3/api-docs 자체를 나열하는 게이트웨이 엔드포인트가 있는지도 확인
          for probe in ["/v3/api-docs", "/v3/api-docs/swagger-config"]:
              try:
                  r = requests.get(f"{base}{probe}", timeout=15)
                  print("===PROBE", probe, "->", r.status_code)
                  print(r.text[:1000])
              except Exception as e:
                  print(probe, "에러:", e)
          PYEOF
          cat eu_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eu_test_result.txt
          git commit -m "test: swagger 후보 탐색" || echo "변경없음"
          git push
