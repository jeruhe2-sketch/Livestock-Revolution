name: EU API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Swagger 명세 확인
        run: |
          python3 << 'PYEOF' > eu_test_result.txt 2>&1
          import requests, json
          base = "https://api.tech.ec.europa.eu/agrifood"
          for name in ["pigmeat", "beef"]:
              try:
                  r = requests.get(f"{base}/v3/api-docs/{name}", timeout=20)
                  print("===", name, "->", r.status_code)
                  if r.status_code == 200:
                      spec = r.json()
                      for path in spec.get("paths", {}):
                          print(" ", path)
                  else:
                      print(r.text[:300])
              except Exception as e:
                  print(name, "에러:", e)
          PYEOF
          cat eu_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add eu_test_result.txt
          git commit -m "test: EU API swagger 진단" || echo "변경없음"
          git push
