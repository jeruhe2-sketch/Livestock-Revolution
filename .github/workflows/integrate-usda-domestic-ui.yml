name: Integrate USDA domestic dashboard UI
on:
  push:
    paths:
      - .github/workflows/integrate-usda-domestic-ui.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch existing ShellApp only
        run: python scripts/integrate_usda_domestic_ui.py
      - name: Bump service worker cache version
        run: sed -i 's/const CACHE_VERSION = "v24";/const CACHE_VERSION = "v25";/' sw.js
      - name: Commit integrated UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "변경없음"
            exit 0
          fi
          git commit -m "feat: add 미국 축산물 내수 현황 tab"
          git push
