name: Fix USDA domestic loader
on:
  push:
    paths:
      - .github/workflows/fix-usda-domestic-loader.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load USDA domestic app before main script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./scripts/usda_domestic_app.js?v=2"></script>'
          if tag not in s:
              marker = '<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>'
              if marker not in s:
                  raise SystemExit('React script marker not found')
              s = s.replace(marker, marker + '\n<script src="./scripts/usda_domestic_app.js?v=2"></script>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('loader already present')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: load USDA domestic app before shell render"
          git push
