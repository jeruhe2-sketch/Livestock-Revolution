name: Fix USDA domestic loader
on:
  push:
    paths:
      - .github/workflows/fix-usda-domestic-loader.yml
concurrency:
  group: repo-main-git-write  # 저장소 전체 워크플로우가 공유하는 잠금 (git push 충돌 방지)
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair USDA domestic loader and cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Remove both historical loader tags. Keep exactly one loader immediately before the app code.
          import re
          s = re.sub(r'\n?<script src="\./scripts/usda_domestic_app\.js\?v=[^"]+"></script>', '', s)
          marker = '<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>'
          loader = '<script src="./scripts/usda_domestic_app.js?v=4"></script>'
          if marker not in s:
              raise SystemExit('XLSX marker not found')
          s = s.replace(marker, marker + '\n' + loader, 1)
          s = s.replace('React.createElement(UsdaDomesticApp, null)', 'React.createElement(window.UsdaDomesticApp, null)', 1)
          p.write_text(s, encoding='utf-8')
          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = re.sub(r'const CACHE_VERSION = "v\d+";', 'const CACHE_VERSION = "v27";', w, count=1)
          sw.write_text(w, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "fix: repair duplicate USDA domestic loader and cache" || exit 0
          git push
