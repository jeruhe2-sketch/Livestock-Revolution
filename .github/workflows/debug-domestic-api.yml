name: debug-domestic-api

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - env:
          QIA_API_KEY: ${{ secrets.QIA_API_KEY }}
        run: python scripts/_debug_domestic_api.py
