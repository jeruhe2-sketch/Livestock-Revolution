name: 미국 축산물 대한(외) 수출현황 자동 갱신 (USDA ESR)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 데이터 수집
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python3 scripts/fetch_usda_esr.py
      - name: 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/usda_meat_export.json
          git commit -m "chore: 미국 축산물 수출현황 자동 갱신 $(date +%Y-%m-%d)" || echo "변경없음"
          git push
