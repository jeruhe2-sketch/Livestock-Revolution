name: debug-eu-fail

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: |
          python3 - <<'PYEOF' > /tmp/eu.log 2>&1
          import requests, time
          url = "https://api.tech.ec.europa.eu/agrifood/api/taxud/weeklyData/export"
          for year in [2024, 2025, 2026]:
              t0 = time.time()
              try:
                  r = requests.get(url, params={"sectors":"Pigs","products":"Frozen pig meat","marketingYears":str(year)}, timeout=20)
                  print(year, "status", r.status_code, "elapsed", round(time.time()-t0,1), "len", len(r.text))
                  print(r.text[:300])
              except Exception as e:
                  print(year, "EXC", repr(e), "elapsed", round(time.time()-t0,1))
          PYEOF
          cat /tmp/eu.log
      - name: post result as issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 /tmp/eu.log > /tmp/eu_tail.log
          gh issue create --title "debug: EU 실패원인 $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/eu_tail.log --repo "${{ github.repository }}"
