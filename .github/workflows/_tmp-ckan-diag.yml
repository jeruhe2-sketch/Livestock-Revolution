name: (임시) data.gov.au CKAN 진단

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-main-git-write
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: CKAN 진단 실행
        run: |
          mkdir -p debug
          python3 scripts/_tmp_ckan_diag.py > debug/ckan_diag.log 2>&1
          cat debug/ckan_diag.log
      - name: 결과를 저장소에 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f debug/ckan_diag.log
          git diff --cached --quiet && exit 0
          git commit -m "debug: CKAN 진단 로그 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --mixed origin/main; git add -f debug/ckan_diag.log; git commit -m "debug: CKAN 진단 로그(재시도)" || true; }
            sleep 3
          done
