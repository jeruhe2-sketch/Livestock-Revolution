name: debug-yahoo-fx

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: |
          python scripts/_debug_yahoo_fx.py > /tmp/yahoo_fx.log 2>&1 || true
          cat /tmp/yahoo_fx.log
      - name: post result as issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "debug: 야후 환율 API 탐색 $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/yahoo_fx.log --repo "${{ github.repository }}"
