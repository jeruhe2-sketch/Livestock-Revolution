name: 환율 자동 갱신

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 기준 전날 22시) - 검역/EU/USDA 데이터와 동일한 시각
    - cron: '0 22 * * *'
  workflow_dispatch: {}

concurrency:
  # 다른 무거운 워크플로우(창고/호주 등)와 잠금을 공유하면 대기열에서 밀려
  # "실행조차 못하고 취소"될 수 있음(이 경우 워크플로우 내부 어떤 단계도 안 돌아서
  # 실패 알림도 못 보냄 - 2026-09-06/07 이틀 연속 이렇게 놓친 적 있음).
  # 환율 갱신은 파일 하나만 건드리고 자체 재시도+rebase 로직이 있어서
  # 독립된 그룹으로 분리해 항상 즉시 실행되게 함.
  group: exchange-rate-update-own-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: run (실패시 5분 후 최대 2회 재시도)
        id: run
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            python scripts/fetch_exchange_rates.py > /tmp/exrate.log 2>&1
            code=$?
            if [ $code -eq 0 ]; then
              break
            fi
            echo "시도 $attempt 실패" >> /tmp/exrate.log
            if [ $attempt -lt 3 ]; then
              echo "5분 후 재시도" >> /tmp/exrate.log
              sleep 300
            fi
          done
          cat /tmp/exrate.log
          exit $code

      - name: 변경사항 커밋 및 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git add data/exchange_rates.json
            if git diff --cached --quiet; then
              echo "변경 없음"
              break
            fi
            git commit -m "chore: 환율 자동 갱신 $(date -u +%Y-%m-%d)"
            if git push; then
              echo "push 성공"
              break
            fi
            echo "push 충돌, 재시도 $i"
            git fetch origin main
            git reset --mixed origin/main
            sleep $((RANDOM % 10 + 3))
          done

      - name: 스크립트 실패 시 워크플로우도 실패 처리
        if: steps.run.outcome == 'failure'
        run: exit 1

      - name: 실패/취소 시 텔레그램 알림
        if: failure() || cancelled()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] 환율 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
