name: 미국 축산물 수출현황(USDA ESR) 자동 갱신
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: USDA ESR 데이터 수집
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python scripts/fetch_usda_esr.py
      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/usda_meat_export.json
          git diff --cached --quiet && echo "변경없음" && exit 0
          git commit -m "chore: 미국 축산물 수출현황 자동 갱신 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5 6 7 8; do
            git push && break
            echo "push 충돌, 재시도 $i"
            git pull --rebase origin main
            sleep $((RANDOM % 10 + 3))
          done
