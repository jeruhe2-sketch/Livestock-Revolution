name: 미국 축산물 수출현황(USDA ESR) 자동 갱신
on:
  workflow_dispatch: {}
concurrency:
  group: repo-main-git-write  # 저장소 전체 워크플로우가 공유하는 잠금 (git push 충돌 방지)
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: USDA ESR 데이터 수집
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python scripts/fetch_usda_esr.py
      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git add data/usda_meat_export.json
            if git diff --cached --quiet; then
              echo "변경없음"
              break
            fi
            git commit -m "chore: 미국 축산물 수출현황 자동 갱신 $(date -u +%Y-%m-%d)"
            if git push; then
              echo "push 성공"
              break
            fi
            echo "push 충돌, 재시도 $i"
            git fetch origin main
            git reset --mixed origin/main
            sleep $((RANDOM % 10 + 3))
          done

      - name: 실패 시 텔레그램 알림 (요청으로 비활성화됨 - 다시 켜려면 if 조건을 failure()로 되돌리면 됨)
        if: false
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] 미국 축산물(USDA) 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
