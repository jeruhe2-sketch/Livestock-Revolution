name: usda-pk602-update

on:
  # 다른 워크플로우들과 동일하게 cron-job.org에서 workflow_dispatch API를 호출하는 방식 사용
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: run
        id: run
        continue-on-error: true
        run: |
          mkdir -p debug
          python scripts/fetch_usda_pk602.py > debug/usda_pk602_last.log 2>&1
          code=$?
          cat debug/usda_pk602_last.log
          exit $code
      - name: commit
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          for i in 1 2 3 4 5 6 7 8; do
            git add data/usda_pk602.json
            if git diff --cached --quiet; then
              echo "변경 없음"
              break
            fi
            git commit -m "auto: 미국 축산물 내수현황(PK602) 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            if git push; then
              echo "push 성공"
              break
            fi
            echo "push 충돌, 재시도 $i"
            git fetch origin main
            git reset --mixed origin/main
            sleep $((RANDOM % 10 + 3))
          done
      - name: 로그를 아티팩트로 업로드 (git 커밋 안 함)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usda-pk602-update-log
          path: debug/usda_pk602_last.log
          retention-days: 14
          if-no-files-found: ignore
      - name: 수집 실패했으면 워크플로우도 실패로 표시
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::USDA PK602 수집 스크립트가 실패했습니다. debug/usda_pk602_last.log 확인 필요 (데이터 파일은 갱신 안 되고 기존 값 유지됨)"
          exit 1

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] 미국 축산물 내수현황(PK602) 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
