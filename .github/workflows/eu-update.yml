name: eu-update

on:
  # 창고/USDA와 동일하게 GitHub 자체 schedule 대신 cron-job.org에서
  # workflow_dispatch API를 호출하는 방식 사용 (자체 schedule은 비활성 레포에서
  # 누락되는 문제가 있어 다른 워크플로우들도 이 방식으로 통일함)
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: run
        id: run
        continue-on-error: true
        run: |
          mkdir -p debug
          python scripts/fetch_eu_taxud.py > debug/eu_update_last.log 2>&1
          code=$?
          cat debug/eu_update_last.log
          exit $code
      - name: 주차별 실제 EUR 환율 이력 갱신
        id: run_fx
        if: steps.run.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/fetch_fx_history.py > debug/fx_history_last.log 2>&1
          code=$?
          cat debug/fx_history_last.log
          exit $code
      - name: commit
        id: commit
        if: always()
        continue-on-error: true
        run: |
          {
            git config user.email "actions@github.com"
            git config user.name "github-actions"
            for i in 1 2 3 4 5 6 7 8; do
              git add data/eu_pigmeat_trade.json data/fx_history.json
              if git diff --cached --quiet; then
                echo "변경 없음"
                break
              fi
              git commit -m "auto: EU 돈육 수출현황 + 환율 이력 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
              if git push; then
                echo "push 성공"
                break
              fi
              echo "push 충돌, 재시도 $i"
              git fetch origin main
              git reset --mixed origin/main
              sleep $((RANDOM % 10 + 3))
            done
          } > debug/eu_commit_last.log 2>&1
          code=$?
          cat debug/eu_commit_last.log
          exit $code
      - name: 환율이력 로그를 아티팩트로 업로드 (git 커밋 안 함)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-history-update-log
          path: debug/fx_history_last.log
          retention-days: 14
          if-no-files-found: ignore
      - name: 커밋 로그를 아티팩트로 업로드 (git 커밋 안 함)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-commit-log
          path: debug/eu_commit_last.log
          retention-days: 14
          if-no-files-found: ignore
      - name: 로그를 아티팩트로 업로드 (git 커밋 안 함)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-update-log
          path: debug/eu_update_last.log
          retention-days: 14
          if-no-files-found: ignore
      - name: 수집 실패했으면 워크플로우도 실패로 표시
        if: steps.run.outcome == 'failure' || steps.run_fx.outcome == 'failure' || steps.commit.outcome == 'failure'
        run: |
          echo "::error::EU API/환율이력 수집 또는 커밋이 실패했습니다. debug/ 로그 확인 필요"
          exit 1

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] EU 돈육 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
