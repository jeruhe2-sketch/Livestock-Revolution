name: eu-update

on:
  # 창고/USDA와 동일하게 GitHub 자체 schedule 대신 cron-job.org에서
  # workflow_dispatch API를 호출하는 방식 사용 (자체 schedule은 비활성 레포에서
  # 누락되는 문제가 있어 다른 워크플로우들도 이 방식으로 통일함)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: run
        id: run
        continue-on-error: true
        run: mkdir -p debug && python scripts/fetch_eu_taxud.py 2>&1 | tee debug/eu_update_last.log
      - name: commit
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          for i in 1 2 3 4 5 6 7 8; do
            git add data/eu_pigmeat_trade.json debug/eu_update_last.log
            if git diff --cached --quiet; then
              echo "변경 없음"
              break
            fi
            git commit -m "auto: EU 돈육 수출현황 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            if git push; then
              echo "push 성공"
              break
            fi
            echo "push 충돌, 재시도 $i"
            git fetch origin main
            git reset --mixed origin/main
            sleep $((RANDOM % 10 + 3))
          done
      - name: 수집 실패했으면 워크플로우도 실패로 표시
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::EU API 수집 스크립트가 실패했습니다. debug/eu_update_last.log 확인 필요 (데이터 파일은 갱신 안 되고 기존 값 유지됨)"
          exit 1
