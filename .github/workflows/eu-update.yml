name: eu-update

on:
  workflow_dispatch: {}
  schedule:
    # 매주 화/목 07:10 UTC(한국시간 16:10) — TAXUD Weekly는 주간 데이터라 하루 1~2회면 충분
    - cron: "10 7 * * 2,4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/fetch_eu_taxud.py
      - run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add data/eu_pigmeat_trade.json
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "auto: EU 돈육 수출현황 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "retry $i"; sleep 5
          done
