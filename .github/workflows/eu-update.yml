name: eu-update

on:
  # 창고/USDA와 동일하게 GitHub 자체 schedule 대신 cron-job.org에서
  # workflow_dispatch API를 호출하는 방식 사용 (자체 schedule은 비활성 레포에서
  # 누락되는 문제가 있어 다른 워크플로우들도 이 방식으로 통일함)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: run
        continue-on-error: true
        run: mkdir -p debug && python scripts/fetch_eu_taxud.py 2>&1 | tee debug/eu_update_last.log
      - name: commit
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add data/eu_pigmeat_trade.json debug/eu_update_last.log
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "auto: EU 돈육 수출현황 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "retry $i"; sleep 5
          done
