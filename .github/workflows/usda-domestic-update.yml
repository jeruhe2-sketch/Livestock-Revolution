name: 미국 축산물 내수현황(USDA MMN PK602) 자동 갱신
on:
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: USDA MyMarketNews PK602 데이터 수집
        env:
          USDA_MMN_API_KEY: ${{ secrets.USDA_MMN_API_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python scripts/fetch_usda_pork_domestic.py
      - name: 데이터 변경사항 확인 및 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/usda_pork_domestic.json
          if git diff --cached --quiet; then
            echo "변경없음"
            exit 0
          fi
          git commit -m "chore: 미국 축산물 내수현황 PK602 자동 갱신 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 충돌, 재시도 $i"
            git fetch origin main
            git reset --mixed origin/main
            git add data/usda_pork_domestic.json
            git diff --cached --quiet && exit 0
            git commit -m "chore: 미국 축산물 내수현황 PK602 자동 갱신 재시도 $(date -u +%Y-%m-%d)"
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] 미국 축산물 내수현황(USDA PK602) 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
