name: 매일 데이터 자동 갱신

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 기준 전날 22시)
    - cron: '0 22 * * *'
  workflow_dispatch: {}  # "Run workflow" 버튼으로 수동 실행도 가능

concurrency:
  group: repo-main-git-write  # 저장소 전체 워크플로우가 공유하는 잠금 (git push 충돌 방지)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 데이터 갱신 스크립트 실행 (실패시 5분 후 최대 2회 재시도)
        id: run_script
        continue-on-error: true
        env:
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}
        run: |
          mkdir -p debug
          for attempt in 1 2 3; do
            python scripts/update_data.py > debug/daily_update_last.log 2>&1
            code=$?
            echo "exit_code=$code (시도 $attempt/3)" >> debug/daily_update_last.log
            if [ $code -eq 0 ]; then
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "시도 $attempt 실패, 5분 후 재시도" >> debug/daily_update_last.log
              sleep 300
            fi
          done
          cat debug/daily_update_last.log
          exit $code

      - name: 변경사항 커밋 및 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git add data/master_flat.json
            if git diff --cached --quiet; then
              echo "변경 없음, 커밋 스킵"
              break
            fi
            git commit -m "chore: 데이터 자동 갱신 $(date -u +%Y-%m-%d)"
            if git push; then
              echo "push 성공"
              break
            fi
            echo "push 충돌, 재시도 $i"
            git fetch origin main
            git reset --mixed origin/main
            sleep $((RANDOM % 10 + 3))
          done

      - name: 로그를 아티팩트로 업로드 (git 커밋 안 함)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-update-log
          path: debug/daily_update_last.log
          retention-days: 14
          if-no-files-found: ignore

      - name: 실패 시에만 진단 로그를 리포에 커밋 (평소엔 커밋 안 함)
        if: steps.run_script.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add -f debug/daily_update_last.log
          git commit -m "debug: 수입검역 자동갱신 실패 로그 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          for i in 1 2 3; do
            git push && break
            git fetch origin main
            git reset --mixed origin/main
            git add -f debug/daily_update_last.log
            sleep 3
          done

      - name: 스크립트 실패 시 워크플로우도 실패 처리
        if: steps.run_script.outcome == 'failure'
        run: exit 1

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] 수입검역 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
