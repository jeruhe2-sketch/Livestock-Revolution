name: 매일 데이터 자동 갱신

on:
  schedule:
    # 매일 한국시간 오전 7시 (UTC 기준 전날 22시)
    - cron: '0 22 * * *'
  workflow_dispatch: {}  # "Run workflow" 버튼으로 수동 실행도 가능

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 데이터 갱신 스크립트 실행
        id: run_script
        continue-on-error: true
        env:
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}
        run: |
          mkdir -p debug
          python scripts/update_data.py > debug/daily_update_last.log 2>&1
          echo "exit_code=$?" >> debug/daily_update_last.log
          cat debug/daily_update_last.log

      - name: 변경사항 커밋 및 푸시
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git add data/master_flat.json debug/daily_update_last.log
            if git diff --cached --quiet; then
              echo "변경 없음, 커밋 스킵"
              break
            fi
            git commit -m "chore: 데이터 자동 갱신 $(date -u +%Y-%m-%d)"
            if git push; then
              echo "push 성공"
              break
            fi
            echo "push 충돌, 재시도 $i"
            git fetch origin main
            git reset --mixed origin/main
            sleep $((RANDOM % 10 + 3))
          done

      - name: 스크립트 실패 시 워크플로우도 실패 처리
        if: steps.run_script.outcome == 'failure'
        run: exit 1
