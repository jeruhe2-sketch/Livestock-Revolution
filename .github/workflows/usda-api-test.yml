name: USDA API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 새 base URL + ESRQS 테스트
        env:
          USDA_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python3 << 'PYEOF' > usda_test_result.txt 2>&1
          import requests, os
          key = os.environ["USDA_KEY"]

          # 1) api.fas.usda.gov 새 base URL 테스트
          print("### api.fas.usda.gov 테스트 ###")
          for path in ["/api/psd/countries", "/psd/countries"]:
              url = "https://api.fas.usda.gov" + path
              try:
                  r = requests.get(url, headers={"X-Api-Key": key}, timeout=15)
                  print(f"{url} -> {r.status_code} | {r.text[:150]}")
              except Exception as e:
                  print(url, "에러:", e)

          # 2) ESRQS - 키 필요없는 새 시스템 탐색
          print()
          print("### ESRQS 탐색 ###")
          for url in [
              "https://apps.fas.usda.gov/esrqs/",
              "https://apps.fas.usda.gov/esrqs/api/exports",
              "https://apps.fas.usda.gov/esrqs/#/home",
          ]:
              try:
                  r = requests.get(url, timeout=15)
                  print(f"{url} -> {r.status_code} | {r.text[:200]}")
              except Exception as e:
                  print(url, "에러:", e)
          PYEOF
          cat usda_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usda_test_result.txt
          git commit -m "test: 새 base URL + ESRQS 탐색" || echo "변경없음"
          git push
