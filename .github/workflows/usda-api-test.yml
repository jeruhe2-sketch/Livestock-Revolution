name: USDA API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 국가코드 확인
        env:
          USDA_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python3 << 'PYEOF' > usda_test_result.txt 2>&1
          import requests, os, json
          key = os.environ["USDA_KEY"]
          base = "https://api.fas.usda.gov/api"
          headers = {"X-Api-Key": key}
          r = requests.get(f"{base}/esr/countries", headers=headers, timeout=20)
          countries = r.json()
          for target in ["UNITED KINGDOM", "JAPAN", "PHILIPPINES"]:
              matches = [c for c in countries if target in c.get("countryDescription","").upper()]
              print(target, "->", matches)
          PYEOF
          cat usda_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usda_test_result.txt
          git commit -m "test: UK/일본/필리핀 국가코드" || echo "변경없음"
          git push
