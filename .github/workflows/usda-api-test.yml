name: USDA API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 한국향 돼지고기/소고기 ESR 실데이터
        env:
          USDA_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python3 << 'PYEOF' > usda_test_result.txt 2>&1
          import requests, os, json
          key = os.environ["USDA_KEY"]
          base = "https://api.fas.usda.gov/api"
          headers = {"X-Api-Key": key}

          for commodity, name in [(1702,"돼지고기"), (1701,"소고기")]:
              r = requests.get(f"{base}/esr/exports/commodityCode/{commodity}/countryCode/5800/marketYear/2026", headers=headers, timeout=20)
              print(f"=== {name}(코드{commodity}) 한국향 2026 -> {r.status_code}")
              if r.status_code == 200:
                  data = r.json()
                  print("  총 행수:", len(data))
                  data.sort(key=lambda x: x.get("weekEndingDate",""))
                  for row in data[-3:]:
                      print("  ", row)
              else:
                  print("  ", r.text[:300])
              print()
          PYEOF
          cat usda_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usda_test_result.txt
          git commit -m "test: 한국향 돼지/소고기 ESR 실데이터" || echo "변경없음"
          git push
