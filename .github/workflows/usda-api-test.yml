name: USDA API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 국가 목록 전체 확인
        env:
          USDA_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python3 << 'PYEOF' > usda_test_result.txt 2>&1
          import requests, os, json
          key = os.environ["USDA_KEY"]
          base = "https://api.fas.usda.gov/api"
          headers = {"X-Api-Key": key}

          r = requests.get(f"{base}/esr/countries", headers=headers, timeout=20)
          countries = r.json()
          print("전체 국가수:", len(countries))
          print("샘플 3개:", countries[:3])
          print()
          kr = [c for c in countries if "kor" in json.dumps(c).lower()]
          print("kor 포함:", kr)
          us = [c for c in countries if c.get("countryCode") in (5700, 1220, 2010)]
          print("코드로 찾은것:", us)
          PYEOF
          cat usda_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usda_test_result.txt
          git commit -m "test: 국가목록 확인" || echo "변경없음"
          git push
