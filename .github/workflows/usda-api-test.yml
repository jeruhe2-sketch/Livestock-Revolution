name: USDA API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 돼지/소고기 커모디티 코드 및 실데이터 탐색
        env:
          USDA_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python3 << 'PYEOF' > usda_test_result.txt 2>&1
          import requests, os, json
          key = os.environ["USDA_KEY"]
          base = "https://api.fas.usda.gov/api"
          headers = {"X-Api-Key": key}

          # PSD 커모디티 목록에서 돼지/소 관련 찾기
          r = requests.get(f"{base}/psd/commodities", headers=headers, timeout=20)
          commodities = r.json()
          print("PSD 커모디티 총", len(commodities), "개")
          for c in commodities:
              name = c.get("commodityName","")
              if "Pork" in name or "Swine" in name or "Beef" in name or "Cattle" in name or "Meat" in name:
                  print(" ", c)

          print()
          # ESR 커모디티 목록에서도 확인
          r2 = requests.get(f"{base}/esr/commodities", headers=headers, timeout=20)
          print("ESR 상태:", r2.status_code)
          if r2.status_code == 200:
              esr_commodities = r2.json()
              print("ESR 커모디티 총", len(esr_commodities), "개")
              for c in esr_commodities:
                  name = c.get("commodityName","")
                  if "Pork" in name or "Swine" in name or "Beef" in name or "Cattle" in name or "Meat" in name:
                      print(" ", c)
          PYEOF
          cat usda_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usda_test_result.txt
          git commit -m "test: 돼지/소고기 커모디티 코드 탐색" || echo "변경없음"
          git push
