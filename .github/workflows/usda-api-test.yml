name: USDA API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 국가코드 확인
        env:
          USDA_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python3 << 'PYEOF' > usda_test_result.txt 2>&1
          import requests, os
          key = os.environ["USDA_KEY"]
          base = "https://api.fas.usda.gov/api"
          headers = {"X-Api-Key": key}
          r = requests.get(f"{base}/esr/countries", headers=headers, timeout=20)
          countries = r.json()
          for t in ["MEXICO", "CANADA", "TAIWAN", "VIETNAM"]:
              matches = [c for c in countries if t in c.get("countryDescription","").upper()]
              print(t, "->", matches)
          PYEOF
          cat usda_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usda_test_result.txt
          git commit -m "test: 멕시코/캐나다/대만/베트남 국가코드 확인" || echo "변경없음"
          git push
