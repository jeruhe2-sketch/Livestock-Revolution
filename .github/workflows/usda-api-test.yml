name: USDA API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 헤더 후보 테스트
        env:
          USDA_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python3 << 'PYEOF' > usda_test_result.txt 2>&1
          import requests, os
          key = os.environ["USDA_KEY"]
          url = "https://apps.fas.usda.gov/OpenData/api/psd/commodities"

          candidates = [
              ("X-Api-Key header", {"X-Api-Key": key}, None),
              ("Api_Key header", {"Api_Key": key}, None),
              ("API_KEY header", {"API_KEY": key}, None),
              ("Authorization Bearer", {"Authorization": f"Bearer {key}"}, None),
              ("query api_key", {}, {"api_key": key}),
              ("query API_KEY", {}, {"API_KEY": key}),
              ("Ocp-Apim-Subscription-Key", {"Ocp-Apim-Subscription-Key": key}, None),
          ]
          for name, headers, params in candidates:
              try:
                  r = requests.get(url, headers=headers, params=params, timeout=15)
                  print(f"=== {name} -> {r.status_code}")
                  print("   ", r.text[:150])
              except Exception as e:
                  print(name, "에러:", e)
          PYEOF
          cat usda_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usda_test_result.txt
          git commit -m "test: USDA 헤더 후보 테스트" || echo "변경없음"
          git push
