name: USDA API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: 한국 국가코드 확인 + 실제 돼지고기 수출 데이터 조회
        env:
          USDA_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python3 << 'PYEOF' > usda_test_result.txt 2>&1
          import requests, os, json
          key = os.environ["USDA_KEY"]
          base = "https://api.fas.usda.gov/api"
          headers = {"X-Api-Key": key}

          # 한국 국가코드 찾기
          r = requests.get(f"{base}/esr/countries", headers=headers, timeout=20)
          countries = r.json()
          korea = [c for c in countries if "Korea" in c.get("countryName","")]
          print("한국 관련 국가코드:", korea)

          # 최신 마켓이어 확인
          r2 = requests.get(f"{base}/esr/exports/commodityCode/1702/allCountries/marketYear/2026", headers=headers, timeout=20)
          print("2026년 돼지고기(1702) 전체국가 응답:", r2.status_code)
          if r2.status_code == 200:
              data = r2.json()
              print("총 행수:", len(data))
              korea_code = korea[0]["countryCode"] if korea else None
              korea_rows = [d for d in data if d.get("countryCode")==korea_code]
              print("한국향 행수:", len(korea_rows))
              if korea_rows:
                  korea_rows.sort(key=lambda x: x.get("weekEndingDate",""))
                  print("최근 3건:")
                  for row in korea_rows[-3:]:
                      print(" ", row)
          else:
              print(r2.text[:300])
          PYEOF
          cat usda_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usda_test_result.txt
          git commit -m "test: 한국향 돼지고기 ESR 실데이터 확인" || echo "변경없음"
          git push
