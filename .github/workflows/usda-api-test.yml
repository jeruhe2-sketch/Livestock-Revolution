name: USDA API 진단 테스트 (임시)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: API_KEY 헤더로 세부 테스트
        env:
          USDA_KEY: ${{ secrets.USDA_API_KEY }}
        run: |
          python3 << 'PYEOF' > usda_test_result.txt 2>&1
          import requests, os
          key = os.environ["USDA_KEY"]
          print("키 길이:", len(key), "앞4글자:", key[:4])

          endpoints = [
              "/psd/countries",
              "/psd/commodities",
              "/gats/countries",
          ]
          for ep in endpoints:
              url = "https://apps.fas.usda.gov/OpenData/api" + ep
              for hname in ["API_KEY", "Api_Key", "X-Api-Key"]:
                  headers = {hname: key, "Accept": "application/json"}
                  try:
                      r = requests.get(url, headers=headers, timeout=15)
                      print(f"{ep} [{hname}] -> {r.status_code} | {r.text[:120]}")
                  except Exception as e:
                      print(ep, hname, "에러:", e)
          PYEOF
          cat usda_test_result.txt
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add usda_test_result.txt
          git commit -m "test: USDA API_KEY 헤더 세부 테스트" || echo "변경없음"
          git push
