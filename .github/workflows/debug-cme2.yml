name: debug-cme2
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PYEOF' > /tmp/cme2.log 2>&1
          import requests
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for sym in ["LEV26.CME", "GFV26.CME", "HEV26.CME", "LEV26", "GFV26", "HEV26"]:
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}"
              try:
                  r = requests.get(url, params={"range":"5d","interval":"1d"}, headers={"User-Agent":UA}, timeout=15)
                  print(sym, "status", r.status_code)
                  if r.status_code == 200:
                      j = r.json()
                      res = j["chart"]["result"]
                      if res:
                          meta = res[0]["meta"]
                          print("  price", meta.get("regularMarketPrice"), "time", meta.get("regularMarketTime"), "short", meta.get("shortName"))
                      else:
                          print("  no result:", j["chart"].get("error"))
              except Exception as e:
                  print(sym, "EXC", repr(e))
          PYEOF
          cat /tmp/cme2.log
      - name: post
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "debug: CME 계약월 티커 확인" --body-file /tmp/cme2.log --repo "${{ github.repository }}"
