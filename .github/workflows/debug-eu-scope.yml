name: debug-eu-scope

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PYEOF' > /tmp/eu.log 2>&1
          import requests, time
          BASE = "https://api.tech.ec.europa.eu/agrifood"
          endpoints = [
              ("taxud weeklyData/export (문제의 그 엔드포인트)", "/api/taxud/weeklyData/export", {"sectors":"Pigs","products":"Frozen pig meat","marketingYears":"2026"}),
              ("pigmeat prices (우리가 EU돈가에 쓰는 것)", "/api/pigmeat/prices", {"pigClasses":"S","marketingYears":"2026"}),
              ("beef prices (다른 섹터)", "/api/beef/prices", {"marketingYears":"2026"}),
          ]
          for label, path, params in endpoints:
              t0=time.time()
              try:
                  r = requests.get(BASE+path, params=params, timeout=15)
                  print(label, "-> status", r.status_code, "elapsed", round(time.time()-t0,1))
                  print("  body:", r.text[:200])
              except Exception as e:
                  print(label, "-> EXC", repr(e), "elapsed", round(time.time()-t0,1))
          PYEOF
          cat /tmp/eu.log
      - name: post
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue create --title "debug: EU 범위 확인 $(date -u +%Y-%m-%dT%H:%M:%SZ)" --body-file /tmp/eu.log --repo "${{ github.repository }}"
