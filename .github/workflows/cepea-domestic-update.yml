name: 브라질 돈육/계육 내수현황(CEPEA) 자동 갱신
on:
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests xlrd
      - name: CEPEA 돈육/계육 데이터 수집
        id: fetch
        continue-on-error: true
        run: |
          mkdir -p debug
          python scripts/fetch_cepea_domestic.py > debug/cepea_domestic_last.log 2>&1
          code=$?
          cat debug/cepea_domestic_last.log
          exit $code
      - name: 실패 로그를 저장소에도 커밋 (디버그, 임시)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f debug/cepea_domestic_last.log
          git commit -m "debug: cepea_domestic 실패 로그 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          for i in 1 2 3; do
            git push && break
            git fetch origin main
            git reset --mixed origin/main
            git add -f debug/cepea_domestic_last.log
            sleep 3
          done
      - name: 실패 로그를 Actions 아티팩트로 보관 (git 커밋 안 함)
        if: steps.fetch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cepea-domestic-update-log
          path: debug/cepea_domestic_last.log
          retention-days: 14
          if-no-files-found: ignore
      - name: 데이터 변경사항 확인 및 커밋
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cepea_pork_domestic.json data/cepea_chicken_domestic.json
          if git diff --cached --quiet; then
            echo "변경없음"
            exit 0
          fi
          git commit -m "chore: 브라질 돈육/계육 내수현황(CEPEA) 자동 갱신 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공"
              exit 0
            fi
            echo "push 충돌, 재시도 $i"
            git fetch origin main
            git reset --mixed origin/main
            git add data/cepea_pork_domestic.json data/cepea_chicken_domestic.json
            git diff --cached --quiet && exit 0
            git commit -m "chore: 브라질 돈육/계육 내수현황(CEPEA) 자동 갱신 재시도 $(date -u +%Y-%m-%d)"
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
      - name: 수집 실패 시 워크플로우를 실패로 표시
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::CEPEA 내수 데이터 수집 실패. debug/cepea_domestic_last.log 확인 필요"
          exit 1
      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] 브라질 돈육/계육 내수현황(CEPEA) 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
