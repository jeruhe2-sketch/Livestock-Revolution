name: livestock-inventory-update

on:
  schedule:
    # 재고동향은 월 1회 정도만 갱신되는 자료라 매일 1회면 충분
    - cron: '30 21 * * *'
  workflow_dispatch: {}

concurrency:
  group: livestock-inventory-update-own-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run
        id: run
        continue-on-error: true
        env:
          KAPE_SERVICE_KEY: ${{ secrets.KAPE_SERVICE_KEY }}
        run: |
          python scripts/fetch_livestock_inventory.py > /tmp/inv.log 2>&1
          code=$?
          cat /tmp/inv.log
          exit $code
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add data/livestock_inventory.json
            if git diff --cached --quiet; then echo "변경 없음"; break; fi
            git commit -m "chore: 국내 축산물 재고동향 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push; then echo "push 성공"; break; fi
            git fetch origin main
            git reset --mixed origin/main
            sleep $((RANDOM % 10 + 3))
          done
      - name: 실패 시 워크플로우도 실패 처리
        if: steps.run.outcome == 'failure'
        run: exit 1
      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] 국내 축산물 재고동향 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
