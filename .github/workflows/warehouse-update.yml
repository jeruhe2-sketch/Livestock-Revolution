name: 창고 재고 데이터 자동 갱신 (Playwright)

on:
  # GitHub \uC790\uCCB4 schedule \uD2B8\uB9AC\uAC70\uAC00 \uD558\uB8E8\uC5D0 \uD55C\uBC88 \uC815\uB3C4\uB9CC \ub3c8\uACE0 \ub098\uba38\uC9C0\ub294 \ub204\ub77d\ub418\ub294
  # \ubB38\uC81C\uAC00 \uD655\uC778\ub3fc\uc11c \uc678\ubD80 \uc608\uC57D \uc11c\ube44\uc2a4(cron-job.org)\uc5d0\uC11c
  # workflow_dispatch\ub97c \ud638\ucd9c\ud558\ub294 \ubc29\uc2dd\uc73c\ub85c \ubc14\uafd4\uc11c, \uc5ec\uae30\uc11c\uB294 schedule \uc0ad\uc81c\ud568
  # (\uc911\ubcf5 \uC2E4\ud589 \ubc29\uc9c0)
  workflow_dispatch: {}  # \"Run workflow\" 버튼(또는 API 호출)으로 실행

concurrency:
  group: repo-main-git-write  # 저장소 전체 워크플로우가 공유하는 잠금 (git push 충돌 방지)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요 패키지 설치
        run: pip install playwright beautifulsoup4

      - name: Chromium 브라우저 엔진 설치
        run: python -m playwright install --with-deps chromium

      - name: 창고 데이터 수집 스크립트 실행 (Playwright)
        id: run_script
        continue-on-error: true
        env:
          NWILL_DAECHEONG_UNCLEARED_ID: ${{ secrets.NWILL_DAECHEONG_UNCLEARED_ID }}
          NWILL_DAECHEONG_UNCLEARED_PW: ${{ secrets.NWILL_DAECHEONG_UNCLEARED_PW }}
          NWILL_SINWOO_UNCLEARED_ID: ${{ secrets.NWILL_SINWOO_UNCLEARED_ID }}
          NWILL_SINWOO_UNCLEARED_PW: ${{ secrets.NWILL_SINWOO_UNCLEARED_PW }}
          NWILL_HALLA_CLEARED_ID: ${{ secrets.NWILL_HALLA_CLEARED_ID }}
          NWILL_HALLA_CLEARED_PW: ${{ secrets.NWILL_HALLA_CLEARED_PW }}
          NWILL_HALLA_UNCLEARED_ID: ${{ secrets.NWILL_HALLA_UNCLEARED_ID }}
          NWILL_HALLA_UNCLEARED_PW: ${{ secrets.NWILL_HALLA_UNCLEARED_PW }}
          NWILL_DAECHEONG_CLEARED_ID: ${{ secrets.NWILL_DAECHEONG_CLEARED_ID }}
          NWILL_DAECHEONG_CLEARED_PW: ${{ secrets.NWILL_DAECHEONG_CLEARED_PW }}
          NWILL_SINWOO_LIVESTOCK_CLEARED_ID: ${{ secrets.NWILL_SINWOO_LIVESTOCK_CLEARED_ID }}
          NWILL_SINWOO_LIVESTOCK_CLEARED_PW: ${{ secrets.NWILL_SINWOO_LIVESTOCK_CLEARED_PW }}
          NWILL_SINWOO_LIVESTOCK_UNCLEARED_ID: ${{ secrets.NWILL_SINWOO_LIVESTOCK_UNCLEARED_ID }}
          NWILL_SINWOO_LIVESTOCK_UNCLEARED_PW: ${{ secrets.NWILL_SINWOO_LIVESTOCK_UNCLEARED_PW }}
          NWILL_SINWOO_POULTRY_CLEARED_ID: ${{ secrets.NWILL_SINWOO_POULTRY_CLEARED_ID }}
          NWILL_SINWOO_POULTRY_CLEARED_PW: ${{ secrets.NWILL_SINWOO_POULTRY_CLEARED_PW }}
          NWILL_SAMJIN1_ID: ${{ secrets.NWILL_SAMJIN1_ID }}
          NWILL_SAMJIN1_PW: ${{ secrets.NWILL_SAMJIN1_PW }}
          NWILL_SAMJIN2_ID: ${{ secrets.NWILL_SAMJIN2_ID }}
          NWILL_SAMJIN2_PW: ${{ secrets.NWILL_SAMJIN2_PW }}
          NWILL_AURORA_ID: ${{ secrets.NWILL_AURORA_ID }}
          NWILL_AURORA_PW: ${{ secrets.NWILL_AURORA_PW }}
          NWILL_SAMIL_ID: ${{ secrets.NWILL_SAMIL_ID }}
          NWILL_SAMIL_PW: ${{ secrets.NWILL_SAMIL_PW }}
          NWILL_GANGDONG_ID: ${{ secrets.NWILL_GANGDONG_ID }}
          NWILL_GANGDONG_PW: ${{ secrets.NWILL_GANGDONG_PW }}
          ACECS_ID: ${{ secrets.ACECS_ID }}
          ACECS_PW: ${{ secrets.ACECS_PW }}
        run: |
          mkdir -p debug
          python scripts/fetch_all_warehouses_playwright.py > debug/last_run.log 2>&1
          echo "exit_code=$?" >> debug/last_run.log
          cat debug/last_run.log

      - name: 디버그 로그 및 변경사항 커밋 및 푸시
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pushed=0
          for i in $(seq 1 20); do
            git add data/warehouse_stock.json data/warehouse_history.json
            if git diff --cached --quiet; then
              echo "변경 없음, 커밋 스킵"
              pushed=1
              break
            fi
            git commit -m "chore: 창고 데이터 자동 갱신 $(date -u +%Y-%m-%d)"
            if git push; then
              echo "push 성공"
              pushed=1
              break
            fi
            echo "push 충돌(다른 워크플로우와 동시 실행으로 보임), 재시도 $i"
            git fetch origin main
            git reset --mixed origin/main
            # history.json은 이번 실행 시작 시점 스냅샷이라, 재시도할 때마다
            # origin의 최신 상태 위에 "오늘 레코드만" 다시 병합해야 다른 실행이
            # 넣어둔 다른 날짜 기록이 사라지지 않는다.
            python scripts/merge_warehouse_history.py
            sleep $((RANDOM % 15 + 5))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::재시도 20회 후에도 push 실패. 이번 실행의 창고 데이터/이력 갱신이 유실됐습니다."
            exit 1
          fi
          done

      - name: 로그/스냅샷을 아티팩트로 업로드 (git 커밋 안 함)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-update-debug
          path: |
            debug/last_run.log
            debug/snapshot_*.html
          retention-days: 14
          if-no-files-found: ignore

      - name: 스크립트 실패 시 워크플로우도 실패 처리
        if: steps.run_script.outcome == 'failure'
        run: exit 1

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] 종합창고현황 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
