name: 창고 재고 데이터 자동 갱신 (Playwright)

on:
  # GitHub \uC790\uCCB4 schedule \uD2B8\uB9AC\uAC70\uAC00 \uD558\uB8E8\uC5D0 \uD55C\uBC88 \uC815\uB3C4\uB9CC \ub3c8\uACE0 \ub098\uba38\uC9C0\ub294 \ub204\ub77d\ub418\ub294
  # \ubB38\uC81C\uAC00 \uD655\uC778\ub3fc\uc11c \uc678\ubD80 \uc608\uC57D \uc11c\ube44\uc2a4(cron-job.org)\uc5d0\uC11c
  # workflow_dispatch\ub97c \ud638\ucd9c\ud558\ub294 \ubc29\uc2dd\uc73c\ub85c \ubc14\uafd4\uc11c, \uc5ec\uae30\uc11c\uB294 schedule \uc0ad\uc81c\ud568
  # (\uc911\ubcf5 \uC2E4\ud589 \ubc29\uc9c0)
  workflow_dispatch: {}  # \"Run workflow\" 버튼(또는 API 호출)으로 실행

concurrency:
  group: repo-main-git-write  # 저장소 전체 워크플로우가 공유하는 잠금 (git push 충돌 방지)
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요 패키지 설치
        run: pip install playwright beautifulsoup4 cryptography

      - name: Chromium 브라우저 엔진 설치
        run: python -m playwright install --with-deps chromium

      - name: (암호화) 기존 이력 파일 복호화 - 병합 스크립트가 평문을 읽어야 함
        env:
          WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}
        run: |
          if [ -f data/warehouse_history.enc.json ]; then
            python scripts/encrypt_warehouse_data.py --decrypt --password-env WAREHOUSE_PASSWORD data/warehouse_history.enc.json data/warehouse_history.json
          else
            echo "이력 암호화 파일이 아직 없음(최초 실행) - 스킵"
          fi

      - name: 창고 데이터 수집 스크립트 실행 (Playwright)
        id: run_script
        continue-on-error: true
        env:
          NWILL_DAECHEONG_UNCLEARED_ID: ${{ secrets.NWILL_DAECHEONG_UNCLEARED_ID }}
          NWILL_DAECHEONG_UNCLEARED_PW: ${{ secrets.NWILL_DAECHEONG_UNCLEARED_PW }}
          NWILL_SINWOO_UNCLEARED_ID: ${{ secrets.NWILL_SINWOO_UNCLEARED_ID }}
          NWILL_SINWOO_UNCLEARED_PW: ${{ secrets.NWILL_SINWOO_UNCLEARED_PW }}
          NWILL_HALLA_CLEARED_ID: ${{ secrets.NWILL_HALLA_CLEARED_ID }}
          NWILL_HALLA_CLEARED_PW: ${{ secrets.NWILL_HALLA_CLEARED_PW }}
          NWILL_HALLA_UNCLEARED_ID: ${{ secrets.NWILL_HALLA_UNCLEARED_ID }}
          NWILL_HALLA_UNCLEARED_PW: ${{ secrets.NWILL_HALLA_UNCLEARED_PW }}
          NWILL_DAECHEONG_CLEARED_ID: ${{ secrets.NWILL_DAECHEONG_CLEARED_ID }}
          NWILL_DAECHEONG_CLEARED_PW: ${{ secrets.NWILL_DAECHEONG_CLEARED_PW }}
          NWILL_SINWOO_LIVESTOCK_CLEARED_ID: ${{ secrets.NWILL_SINWOO_LIVESTOCK_CLEARED_ID }}
          NWILL_SINWOO_LIVESTOCK_CLEARED_PW: ${{ secrets.NWILL_SINWOO_LIVESTOCK_CLEARED_PW }}
          NWILL_SINWOO_LIVESTOCK_UNCLEARED_ID: ${{ secrets.NWILL_SINWOO_LIVESTOCK_UNCLEARED_ID }}
          NWILL_SINWOO_LIVESTOCK_UNCLEARED_PW: ${{ secrets.NWILL_SINWOO_LIVESTOCK_UNCLEARED_PW }}
          NWILL_SINWOO_POULTRY_CLEARED_ID: ${{ secrets.NWILL_SINWOO_POULTRY_CLEARED_ID }}
          NWILL_SINWOO_POULTRY_CLEARED_PW: ${{ secrets.NWILL_SINWOO_POULTRY_CLEARED_PW }}
          NWILL_SAMJIN1_ID: ${{ secrets.NWILL_SAMJIN1_ID }}
          NWILL_SAMJIN1_PW: ${{ secrets.NWILL_SAMJIN1_PW }}
          NWILL_SAMJIN2_ID: ${{ secrets.NWILL_SAMJIN2_ID }}
          NWILL_SAMJIN2_PW: ${{ secrets.NWILL_SAMJIN2_PW }}
          NWILL_AURORA_ID: ${{ secrets.NWILL_AURORA_ID }}
          NWILL_AURORA_PW: ${{ secrets.NWILL_AURORA_PW }}
          NWILL_SAMIL_ID: ${{ secrets.NWILL_SAMIL_ID }}
          NWILL_SAMIL_PW: ${{ secrets.NWILL_SAMIL_PW }}
          NWILL_GANGDONG_ID: ${{ secrets.NWILL_GANGDONG_ID }}
          NWILL_GANGDONG_PW: ${{ secrets.NWILL_GANGDONG_PW }}
          NWILL_GANGDONG2_ID: ${{ secrets.NWILL_GANGDONG2_ID }}
          NWILL_GANGDONG2_PW: ${{ secrets.NWILL_GANGDONG2_PW }}
          ACECS_ID: ${{ secrets.ACECS_ID }}
          ACECS_PW: ${{ secrets.ACECS_PW }}
        run: |
          mkdir -p debug
          python scripts/fetch_all_warehouses_playwright.py > debug/last_run.log 2>&1
          echo "exit_code=$?" >> debug/last_run.log
          cat debug/last_run.log

      - name: (암호화) 새로 수집한 데이터를 암호화
        env:
          WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}
        run: |
          python scripts/encrypt_warehouse_data.py --password-env WAREHOUSE_PASSWORD data/warehouse_stock.json data/warehouse_stock.enc.json
          python scripts/encrypt_warehouse_data.py --password-env WAREHOUSE_PASSWORD data/warehouse_history.json data/warehouse_history.enc.json

      - name: 디버그 로그 및 변경사항 커밋 및 푸시
        id: commit
        if: always()
        env:
          WAREHOUSE_PASSWORD: ${{ secrets.WAREHOUSE_PASSWORD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          pushed=0
          : > debug/git_push_debug.log
          for i in $(seq 1 20); do
            git add data/warehouse_stock.enc.json data/warehouse_history.enc.json
            # 파싱 0건일 때 남기는 원본 페이지 스냅샷도 같이 커밋(평소 .gitignore에
            # 걸려서 조용히 유실되고 있었음 - 강동2냉장 0건 원인 파악할 때 이걸
            # 못 봐서 한참 헤맸음). 있을 때만 강제로 추가.
            git add -f debug/snapshot_*.html 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "[시도 $i] 변경 없음, 커밋 스킵" >> debug/git_push_debug.log
              pushed=1
              break
            fi
            git commit -m "chore: 창고 데이터 자동 갱신 $(date -u +%Y-%m-%d)" >> debug/git_push_debug.log 2>&1
            echo "[시도 $i] git push 실행..." >> debug/git_push_debug.log
            if git push >> debug/git_push_debug.log 2>&1; then
              echo "[시도 $i] push 성공" >> debug/git_push_debug.log
              pushed=1
              break
            fi
            echo "[시도 $i] push 실패, 재시도 준비" >> debug/git_push_debug.log
            git fetch origin main >> debug/git_push_debug.log 2>&1
            git reset --mixed origin/main >> debug/git_push_debug.log 2>&1
            # history.enc.json은 이번 실행 시작 시점 스냅샷이라, 재시도할 때마다
            # origin의 최신 상태 위에 "오늘 레코드만" 다시 병합해야 다른 실행이
            # 넣어둔 다른 날짜 기록이 사라지지 않는다. 병합 스크립트는 평문을
            # 다루므로 복호화 -> 병합 -> 재암호화 순서로 감싼다.
            git checkout origin/main -- data/warehouse_history.enc.json 2>>debug/git_push_debug.log || true
            python scripts/encrypt_warehouse_data.py --decrypt --password-env WAREHOUSE_PASSWORD data/warehouse_history.enc.json data/warehouse_history.json >> debug/git_push_debug.log 2>&1
            python scripts/merge_warehouse_history.py >> debug/git_push_debug.log 2>&1
            python scripts/encrypt_warehouse_data.py --password-env WAREHOUSE_PASSWORD data/warehouse_history.json data/warehouse_history.enc.json >> debug/git_push_debug.log 2>&1
            sleep $((RANDOM % 15 + 5))
          done
          cat debug/git_push_debug.log
          if [ "$pushed" != "1" ]; then
            # 실패했을 때만 진단 로그를 커밋해서 남긴다 (평소엔 30분마다 도는데
            # 매번 커밋하면 저장소가 로그로만 계속 부풀어서, 문제 있을 때만 남김)
            git add -f debug/git_push_debug.log 2>/dev/null || true
            git commit -m "debug: git push 진단 로그(실패) $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            for i in 1 2 3; do
              git push && break
              git fetch origin main
              git reset --mixed origin/main
              git add -f debug/git_push_debug.log
              sleep 3
            done
          fi
          if [ "$pushed" != "1" ]; then
            echo "::error::재시도 20회 후에도 push 실패. 이번 실행의 창고 데이터/이력 갱신이 유실됐습니다."
            exit 1
          fi

      - name: 로그/스냅샷을 아티팩트로 업로드 (git 커밋 안 함)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-update-debug
          path: |
            debug/last_run.log
            debug/snapshot_*.html
          retention-days: 14
          if-no-files-found: ignore

      - name: 스크립트 실패 시 워크플로우도 실패 처리
        if: steps.run_script.outcome == 'failure'
        run: exit 1

      - name: 실패 시 텔레그램 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>[축산레이더] 종합창고현황 자동 갱신 실패</b>
            로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
