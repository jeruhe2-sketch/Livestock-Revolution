name: (임시) 강동2 로그인 진단

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-main-git-write
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install playwright beautifulsoup4
      - name: Chromium 설치
        run: python -m playwright install --with-deps chromium
      - name: 강동1+강동2 순차실행 재현 테스트 + 결과 커밋
        env:
          NWILL_GANGDONG_ID: ${{ secrets.NWILL_GANGDONG_ID }}
          NWILL_GANGDONG_PW: ${{ secrets.NWILL_GANGDONG_PW }}
          NWILL_GANGDONG2_ID: ${{ secrets.NWILL_GANGDONG2_ID }}
          NWILL_GANGDONG2_PW: ${{ secrets.NWILL_GANGDONG2_PW }}
        run: |
          mkdir -p debug
          python scripts/_tmp_debug_sequential.py > debug/gd_sequential.log 2>&1 || true
          cat debug/gd_sequential.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f debug/gd_sequential.log
          git diff --cached --quiet && { echo "커밋할 변경사항 없음"; exit 0; }
          git commit -m "debug: 강동1+2 순차실행 재현 테스트 결과"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --mixed origin/main; git add -f debug/gd_sequential.log; git commit -m "debug: 순차실행 재현 테스트(재시도)" || true; }
            sleep 3
          done
