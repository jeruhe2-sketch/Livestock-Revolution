name: (임시) 강동2 로그인 진단

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-main-git-write
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install playwright beautifulsoup4
      - name: Chromium 설치
        run: python -m playwright install --with-deps chromium
      - name: 강동2 로그인 진단 실행 + 결과 커밋
        env:
          NWILL_GANGDONG2_ID: ${{ secrets.NWILL_GANGDONG2_ID }}
          NWILL_GANGDONG2_PW: ${{ secrets.NWILL_GANGDONG2_PW }}
        run: |
          mkdir -p debug
          (cd scripts && python _tmp_debug_gd2.py) > debug/gd2_diagnosis.log 2>&1 || true
          echo "=== scripts/debug 안에 잘못 들어간 파일 있는지 확인 (경로버그 방지) ===" >> debug/gd2_diagnosis.log
          ls -la scripts/debug/ >> debug/gd2_diagnosis.log 2>&1 || echo "scripts/debug 없음(정상)" >> debug/gd2_diagnosis.log
          if [ -d scripts/debug ]; then mv scripts/debug/* debug/ 2>/dev/null || true; fi
          echo "=== debug 폴더 내용 ===" >> debug/gd2_diagnosis.log
          ls -la debug/ >> debug/gd2_diagnosis.log
          cat debug/gd2_diagnosis.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in debug/gd2_diagnosis.log debug/gd2_step1.html debug/gd2_step2.html debug/gd2_step3.html debug/gd2_step4.html debug/gd2_step5.html debug/gd2_step1_loaded.png debug/gd2_step2_after_login.png debug/gd2_step3_stock_page.png debug/gd2_step4_after_query.png debug/gd2_step5_full_rows.png debug/gd2_step3_error.html debug/gd2_step3_error.png debug/gd2_error.html debug/gd2_error.png; do
            if [ -f "$f" ]; then git add -f "$f"; echo "added: $f"; else echo "missing: $f"; fi
          done
          git diff --cached --quiet && { echo "커밋할 변경사항 없음"; exit 0; }
          git commit -m "debug: 강동2 로그인 진단 결과"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort; git reset --mixed origin/main; for f in debug/gd2_diagnosis.log debug/gd2_step1.html debug/gd2_step2.html debug/gd2_step3.html debug/gd2_step4.html debug/gd2_step5.html debug/gd2_step1_loaded.png debug/gd2_step2_after_login.png debug/gd2_step3_stock_page.png debug/gd2_step4_after_query.png debug/gd2_step5_full_rows.png debug/gd2_step3_error.html debug/gd2_step3_error.png debug/gd2_error.html debug/gd2_error.png; do [ -f "$f" ] && git add -f "$f"; done; git commit -m "debug: 강동2 로그인 진단 결과(재시도)" || true; }
            sleep 3
          done
